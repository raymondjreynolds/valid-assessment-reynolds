services:
  - type: web
    name: valid-assessment-reynolds
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FINGERPRINT_METHOD
        value: vpdq
      - key: FRAME_SAMPLE_FPS
        value: "1"
      - key: MAX_FRAMES
        value: "24"
      - key: VPDQ_HAMMING_THRESHOLD
        value: "45"
      - key: MIN_ALIGNED_FRAMES
        value: "2"
