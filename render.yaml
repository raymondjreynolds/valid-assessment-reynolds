services:
  - type: web
    name: valid-assessment-reynolds
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FINGERPRINT_METHOD
        value: onnx
      - key: ONNX_MODEL
        value: clip
      - key: PRELOAD_ONNX
        value: "true"
      - key: FRAME_SAMPLE_FPS
        value: "1"
      - key: MAX_FRAMES
        value: "24"
      - key: FRAME_SCALE_WIDTH
        value: "384"
      - key: LETTERBOX_SIZE
        value: "384"
      - key: VPDQ_HAMMING_THRESHOLD
        value: "50"
      - key: MIN_ALIGNED_FRAMES
        value: "2"
      - key: FFMPEG_FRAME_QUALITY
        value: "2"
